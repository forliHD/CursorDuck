# The unit tests: plain Node, no dependencies, so there is nothing to install.
# (The browser tests need a packaged extension and real browsers; they run locally.)
name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/unit.mjs
